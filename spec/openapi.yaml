openapi: 3.1.0
info:
  title: Habit Tracker API
  version: 0.1.0
  description: |
    Vertrag zwischen Mac-App, iPhone-App und WebApp.

    **Drei Entwurfsentscheidungen, die sich durch alles ziehen:**

    1. Einträge, Tages-Journale und Regeln werden über einen *natürlichen*
       Schlüssel adressiert — `(habitId, date)` statt einer ID. Dadurch ist
       jedes Schreiben ein idempotenter Upsert: ein wiederholter Request ist
       harmlos, und zwei Geräte, die denselben Tag abhaken, meinen dasselbe.
    2. `date` ist ein lokaler Kalendertag (`YYYY-MM-DD`), nie ein Zeitstempel.
       „Habe ich heute Sport gemacht" ist eine Kalenderfrage; Zeitstempel
       führen bei Zeitzonen und Sommerzeit zu falschen Streaks.
    3. Gelöscht wird nur per Grabstein (`deletedAt`). Eine Löschung ohne
       Grabstein ist beim Sync unsichtbar und käme auf anderen Geräten nie an.

    Mac und iPhone arbeiten offline-first gegen eine lokale SQLite-Datenbank
    und gleichen über `/sync` ab. Die WebApp nutzt die REST-Ressourcen direkt.

    Die Auswertungssemantik (Streaks, Ausnahmen, Trend) ist nicht Teil dieser
    Datei, sondern liegt ausführbar in `spec/fixtures/` — beide
    Implementierungen, Swift und TypeScript, laufen gegen dieselben Fixtures.

servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

security:
  - bearerAuth: []

tags:
  - name: auth
    description: In v1 nur ein statisches Token. Die Endpunkte sind dokumentiert,
      damit die Clients schon dafür gebaut sind.
  - name: habits
  - name: entries
  - name: journal
  - name: insights
  - name: sync

paths:
  # ─────────────────────────────── auth ───────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: Konto anlegen (noch nicht implementiert)
      description: |
        In v1 nicht aktiv. Der Server kennt genau einen Nutzer und
        authentifiziert über ein statisches Bearer-Token aus einer
        Umgebungsvariable. `user_id` steckt trotzdem in jeder Zeile, damit
        der spätere Login ohne Datenmigration auskommt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "201": { description: Angelegt }
        "501": { description: In dieser Version nicht verfügbar }

  /auth/login:
    post:
      tags: [auth]
      summary: Anmelden (noch nicht implementiert)
      security: []
      responses:
        "200":
          description: Tokenpaar
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "501": { description: In dieser Version nicht verfügbar }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Access-Token erneuern (noch nicht implementiert)
      security: []
      responses:
        "501": { description: In dieser Version nicht verfügbar }

  # ────────────────────────────── habits ──────────────────────────────
  /habits:
    get:
      tags: [habits]
      summary: Habits auflisten
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
          description: Archivierte Habits verschwinden aus „Heute", bleiben aber
            im Verlauf — daher separat abrufbar.
        - name: tag
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
    post:
      tags: [habits]
      summary: Habit anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitDraft" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }

  /habits/{habitId}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      tags: [habits]
      summary: Einzelnen Habit lesen
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [habits]
      summary: Habit ändern
      description: |
        Ändert **nicht** Zeitplan oder Ziel — die sind versioniert und laufen
        über `/habits/{habitId}/rules/{effectiveFrom}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitPatch" }
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
    delete:
      tags: [habits]
      summary: Habit löschen (Soft-Delete)
      description: Setzt `deletedAt`. Der Papierkorb zeigt die letzten 30 Tage.
      responses:
        "204": { description: Gelöscht }

  /habits/{habitId}/rules/{effectiveFrom}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - name: effectiveFrom
        in: path
        required: true
        schema: { $ref: "#/components/schemas/CalendarDate" }
    put:
      tags: [habits]
      summary: Zeitplan und Ziel ab einem Datum setzen (Upsert)
      description: |
        Vergangene Tage werden mit der damals gültigen Regel bewertet. Deshalb
        muss die UI unterscheiden zwischen „ab heute ändern" (neue Regel mit
        `effectiveFrom = heute`) und „rückwirkend korrigieren" (bestehende Regel
        überschreiben). Ohne diese Unterscheidung legt jeder Tippfehler eine
        Version an und der Verlauf wird zum Flickenteppich.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitRule" }
      responses:
        "200":
          description: Habit mit aktualisierter Regelliste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
    delete:
      tags: [habits]
      summary: Regelversion entfernen
      responses:
        "200":
          description: Habit mit aktualisierter Regelliste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }

  /habits/{habitId}/tags:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    put:
      tags: [habits]
      summary: Tag-Menge eines Habits vollständig setzen
      description: Ersetzt die Zuordnung, statt einzeln zu addieren — das macht
        den Aufruf idempotent und sync-tauglich.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string, format: uuid }
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }

  /tags:
    get:
      tags: [habits]
      summary: Tags auflisten
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
    post:
      tags: [habits]
      summary: Tag anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                colorHex: { type: string }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }

  /tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [habits]
      summary: Tag ändern
      responses:
        "200":
          description: Geändert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
    delete:
      tags: [habits]
      summary: Tag löschen (Soft-Delete)
      responses:
        "204": { description: Gelöscht }

  # ────────────────────────────── entries ─────────────────────────────
  /entries:
    get:
      tags: [entries]
      summary: Einträge aller Habits in einem Zeitraum
      description: Der Aufruf für die Heute- und die Kalenderansicht.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }

  /habits/{habitId}/entries:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      tags: [entries]
      summary: Einträge eines Habits
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }

  /habits/{habitId}/entries/{date}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - $ref: "#/components/parameters/Date"
    put:
      tags: [entries]
      summary: Tageswert setzen (idempotenter Upsert)
      description: |
        Der zentrale Schreibvorgang der App. Idempotent, weil über
        `(habitId, date)` adressiert — deshalb ist ein doppelt gesendeter
        Request nach Verbindungsabbruch unschädlich.

        Bei Habits mit `tracksTime` ist `value` **abgeleitet** (Summe der
        Events) und wird vom Server bzw. Store gepflegt; direktes Setzen
        ersetzt dann die Events des Tages.

        Wie weit zurück geschrieben werden darf, begrenzt die Einstellung
        `backfillLimitDays` (Standard 7). Ohne diese Grenze trägt man sich
        rückwirkend einen perfekten Monat ein und die Zahlen sind wertlos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: number }
                note: { type: string, nullable: true }
                source: { $ref: "#/components/schemas/EntrySource" }
      responses:
        "200":
          description: Gesetzt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "422":
          description: Liegt weiter zurück als `backfillLimitDays` erlaubt
    delete:
      tags: [entries]
      summary: Tageswert löschen (Soft-Delete)
      responses:
        "204": { description: Gelöscht }

  /habits/{habitId}/events:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      tags: [entries]
      summary: Zeitstempel-Detail eines Habits
      description: |
        Nur für Habits mit `tracksTime`. Beantwortet Fragen wie „um welche
        Uhrzeit rauche ich" und erlaubt „0,5 L jetzt dazubuchen".

        Die Streak-Engine liest Events **nie** — sie arbeitet ausschließlich
        auf `Entry.value`. Dadurch bleibt der Tages-Upsert idempotent.
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntryEvent" }

  /habits/{habitId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [entries]
      summary: Event setzen (Upsert, ID kommt vom Client)
      description: Der Tageswert des betroffenen Tages wird in derselben
        Transaktion neu berechnet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryEvent" }
      responses:
        "200":
          description: Gesetzt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryEvent" }
    delete:
      tags: [entries]
      summary: Event löschen (Soft-Delete)
      responses:
        "204": { description: Gelöscht }

  # ────────────────────────────── journal ─────────────────────────────
  /days:
    get:
      tags: [journal]
      summary: Tages-Journal über einen Zeitraum
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DayLog" }

  /days/{date}:
    parameters:
      - $ref: "#/components/parameters/Date"
    get:
      tags: [journal]
      summary: Journaleintrag eines Tages
      responses:
        "200":
          description: Eintrag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayLog" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [journal]
      summary: Journaleintrag setzen (idempotenter Upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayLogDraft" }
      responses:
        "200":
          description: Gesetzt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayLog" }

  /exceptions:
    get:
      tags: [journal]
      summary: Tages-Ausnahmen in einem Zeitraum
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DayException" }
    post:
      tags: [journal]
      summary: Ausnahme anlegen
      description: |
        Streak Freeze, Urlaub und bewusster Ruhetag sind dasselbe Konzept.
        Sie unterscheiden sich nur in der Auswertung: ein Freeze rettet den
        Streak, zählt in der Quote aber weiter als verpasst; Urlaub und
        Ruhetag fallen ganz aus dem Nenner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayException" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayException" }

  /exceptions/{exceptionId}:
    parameters:
      - name: exceptionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [journal]
      summary: Ausnahme zurücknehmen
      responses:
        "204": { description: Gelöscht }

  /trash:
    get:
      tags: [journal]
      summary: Papierkorb
      description: |
        Soft-gelöschte Zeilen der letzten 30 Tage. Grabsteine leben 90 Tage
        (der Sync braucht sie), wiederherstellbar sind aber nur die letzten 30 —
        ein späteres Restore würde sonst etwas zurückholen, das andere Geräte
        längst verarbeitet haben.
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashItem" }

  /trash/restore:
    post:
      tags: [journal]
      summary: Gelöschtes wiederherstellen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrashItem" }
      responses:
        "204": { description: Wiederhergestellt }

  # ────────────────────────────── insights ────────────────────────────
  /habits/{habitId}/totals:
    parameters:
      - $ref: "#/components/parameters/HabitId"
    get:
      tags: [insights]
      summary: Summen über einen Zeitraum
      description: |
        Beantwortet „wie viel habe ich diese Woche gemacht?" — eine andere Frage
        als der Streak („wie lange schon?") und als die Quote („wie
        verlässlich?"). Bei Mengen- und Zeiterfassung oft die einzige, die
        zählt: ob fünf Stunden auf drei oder fünf Tage fielen, ist gleichgültig.

        Summiert wird `entry.value` und **nicht** über die Ereignisse: der
        Tageswert ist ohnehin deren Summe, und nur so zählen auch Habits mit,
        die ihre Werte direkt eintragen statt über Sitzungen.

        `averagePerActiveDay` bezieht sich auf Tage **mit** Aktivität. Ein
        Schnitt über alle Tage beantwortet nichts — er sinkt, sobald man den
        Zeitraum vergrößert, ohne dass sich am Verhalten etwas geändert hat.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Summen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodTotal" }
        "404": { $ref: "#/components/responses/NotFound" }

  /habits/{habitId}/stats:
    parameters:
      - $ref: "#/components/parameters/HabitId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      tags: [insights]
      summary: Streaks, Quote, Tagesstatus und Wochentagsverteilung
      responses:
        "200":
          description: Auswertung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitStats" }

  /stats/summary:
    get:
      tags: [insights]
      summary: Aggregat für die Heute-Ansicht
      description: |
        Ohne `date` gilt der Tag des **Servers**, und die Antwort sagt, welcher
        das war. Absichtlich nicht der des Browsers: der Server entscheidet
        ohnehin, was als Nachtrag gilt, und ein Telefon in einer anderen
        Zeitzone bekäme sonst eine Liste für gestern und eine 422 beim Abhaken.
      parameters:
        - name: date
          in: query
          schema: { $ref: "#/components/schemas/CalendarDate" }
      responses:
        "200":
          description: Tagesübersicht
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { $ref: "#/components/schemas/CalendarDate" }
                  dueCount: { type: integer }
                  completedCount: { type: integer }
                  habits:
                    type: array
                    items:
                      type: object
                      properties:
                        habitId: { type: string, format: uuid }
                        status: { $ref: "#/components/schemas/DayStatusCode" }
                        value: { type: number }
                        currentStreak: { type: integer }
                        trend:
                          oneOf:
                            - { $ref: "#/components/schemas/TrendCode" }
                            - { type: "null" }

  /insights/correlations:
    get:
      tags: [insights]
      summary: Zusammenhänge zwischen Habits und dem Journal
      description: |
        Vergleicht je Habit und Journal-Größe die Tage, an denen er erledigt
        war, mit denen, an denen er verpasst wurde (Pearson über eine
        Ja/Nein-Größe). Ausnahmen und Tage ohne Journal-Eintrag fallen heraus,
        statt als Null zu zählen.

        **Die Zurückhaltung ist Teil der Funktion.** Bei wenigen Tagen findet
        man in Zufallsrauschen immer irgendeinen Zusammenhang; wird er
        angezeigt, glaubt man ihn. Drei Hürden, und wer eine reißt, bekommt
        kein abgeschwächtes Ergebnis, sondern keins:

        1. Mindestens 14 gemeinsame Tage und je 5 in beiden Gruppen — ein
           Mittelwert aus zwei Werten ist keiner.
        2. Der Betrag von `r` muss über der **Zufallsgrenze für diese
           Datenmenge** liegen, nicht über einer festen Zahl:
           `r_min = max(0,2; t / √(n − 2 + t²))` mit `t = 3` (etwa p < 0,01,
           zweiseitig). Das sind 0,58 bei 20 Tagen und 0,29 bei 100.
        3. Nie unter 0,2, egal wie viele Tage — bei sehr großen Mengen wird
           auch ein belangloser Zusammenhang rechnerisch bedeutsam.

        Die strenge Schwelle ist Absicht: über acht Habits und drei Größen
        werden zwei Dutzend Paare gleichzeitig geprüft, und bei p < 0,05 wäre
        ein Fehltreffer schon rechnerisch zu erwarten. In der Erprobung mit
        Zufallsdaten meldete eine feste Schwelle von 0,2 sechs „Befunde“ —
        mit dieser Regel keinen.

        Die Clients formulieren das Ergebnis als Satz und **nennen den
        Vorbehalt mit**: es fällt zusammen, ob das eine das andere bewirkt,
        sagen diese Zahlen nicht.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Befunde, der deutlichste zuerst
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Correlation" }

  /freezes:
    get:
      tags: [freezes]
      summary: Buchungen und Kontostand
      description: |
        Ein **Ledger, kein Zähler**: der Kontostand ist die Summe der
        Buchungen, nie ein gespeicherter Wert. Ein Zähler kann falsch werden,
        ohne dass man sieht wie — eine Buchungsreihe nicht, und beim Sync
        bleibt sie konfliktfrei, weil nur angehängt wird. Deshalb tragen die
        Zeilen weder `updatedAt` noch einen Grabstein: eine Buchung wird nicht
        geändert und nicht gelöscht, eine Korrektur ist eine Gegenbuchung.

        **Verdient** wird durch einen durchgezogenen Fokus-Lauf — einer je
        Lauf, höchstens drei auf dem Konto. Ohne Obergrenze sammelt sich über
        Monate ein Polster an, das jeden Streak beliebig lange am Leben hält;
        dann sagt er nichts mehr aus. Steht das Konto voll, **verfällt** der
        Anspruch, statt aufgespart und später nachgezahlt zu werden.

        `focusRunId` macht das Einbuchen idempotent: die Auswertung eines Laufs
        wird bei jedem Lesen neu gerechnet, die Einzahlung darf trotzdem nur
        einmal geschehen.
      responses:
        "200":
          description: Konto
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: integer }
                  maximum: { type: integer }
                  ledger:
                    type: array
                    items: { $ref: "#/components/schemas/FreezeEntry" }

  /freezes/apply:
    post:
      tags: [freezes]
      summary: Einen Freeze für einen Tag einlösen
      description: |
        Legt eine `DayException` mit `kind: frozen` an **und** bucht −1 — in
        einer Transaktion. Getrennt könnten sie auseinanderlaufen, und ein
        geretteter Tag ohne Abzug wäre ein Freeze umsonst.

        Nur auf einen **bereits verpassten** Tag: einen erfüllten braucht man
        nicht zu retten, und der laufende ist noch nicht verloren. Ein Freeze
        auf die Zukunft wäre eine Vorabentschuldigung — genau das, was ein
        Streak nicht aussagen soll. Es gilt dieselbe Nachtrage-Grenze wie für
        Einträge.

        Der Streak hält danach, die Quote nicht: ein eingefrorener Tag bleibt
        in ihrem Nenner. Und er verlängert den Streak nicht, er überbrückt ihn
        nur — sonst ließe sich Streak kaufen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [habitId, date]
              properties:
                habitId: { type: string, format: uuid }
                date: { $ref: "#/components/schemas/CalendarDate" }
      responses:
        "201":
          description: Eingelöst
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayException" }
        "409": { description: Kein Guthaben }
        "422": { description: Dieser Tag lässt sich nicht einfrieren }

  # ─────────────────────────────── focus ──────────────────────────────
  /focus:
    get:
      tags: [focus]
      summary: Alle Fokus-Läufe, ausgewertet
      description: |
        **Das Ergebnis wird berechnet, nie gespeichert.** Ob ein Lauf
        durchgezogen wurde, ergibt sich aus den Einträgen; ein gespeichertes
        „geschafft" würde von ihnen abdriften, sobald ein Tag nachträglich
        korrigiert wird — und wäre dann eine Auszeichnung für etwas, das nicht
        mehr stimmt. Gespeichert ist nur die Absicht: Zeitraum und Auswahl.

        Bewertet wird nach derselben Regel wie `/stats/overview`: ein Tag ist
        geschafft, wenn alles erledigt ist, was an ihm *verpflichtend* war.
        Daraus folgt ohne Sonderfälle, dass ein `timesPerWeek`-Habit einen
        einzelnen Tag nicht reißen kann und dass Urlaub den Tag herausnimmt.
        Ein Streak Freeze rettet einen Fokus dagegen **nicht** — er ist das
        strengere Versprechen.

        Der laufende Tag lässt einen Lauf nie scheitern, solange er offen ist;
        am letzten Tag steht das Ergebnis, sobald alles erledigt ist, damit
        niemand bis Mitternacht warten muss.
      responses:
        "200":
          description: Läufe, der jüngste zuerst
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FocusProgress" }
    post:
      tags: [focus]
      summary: Einen Lauf ab heute starten
      description: |
        Beginnt immer heute. Bewusst nicht rückwirkend startbar: sonst trüge
        man sich nachträglich eine geschaffte Woche ein und die Bilanz wäre
        nichts wert.

        Es kann nur ein *offener* Lauf gleichzeitig existieren — ein noch
        heiler darf nicht still verdrängt werden. Ein bereits gerissener
        blockiert dagegen nicht: sofort neu anfangen zu dürfen ist der Sinn
        eines Fokus, nicht bis zum Fensterende warten zu müssen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, default: 7 }
                title: { type: string }
                habitIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Leer heißt alle Habits, auch später angelegte.
      responses:
        "201":
          description: Gestartet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusRun" }
        "409":
          description: Es läuft bereits ein Fokus, der noch heil ist.

  /focus/{focusId}:
    parameters:
      - name: focusId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [focus]
      summary: Lauf aus dem Verlauf entfernen (Soft-Delete)
      responses:
        "204": { description: Entfernt }
        "404": { $ref: "#/components/responses/NotFound" }

  /focus/{focusId}/abandon:
    parameters:
      - name: focusId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [focus]
      summary: Lauf vorzeitig beenden
      description: |
        Setzt `abandonedOn` auf heute. Ehrlicher, als einen Lauf still
        verrotten zu lassen — und das Ergebnis „abgebrochen" schlägt beim
        Auswerten jedes andere, auch einen rechnerisch noch heilen Lauf.
      responses:
        "200":
          description: Beendet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusRun" }

  # ─────────────────────────────── backup ─────────────────────────────
  /backup:
    get:
      tags: [backup]
      summary: Bestand als Sicherungsdatei ausgeben
      description: |
        Liefert dieselbe JSON-Datei, die die Mac-App über „Sicherung → Sichern"
        schreibt. **Nur lebende Zeilen** — Grabsteine gehören zum
        Sync-Protokoll (`/sync`), nicht zur Sicherung: die beschreibt den
        Bestand, nicht seine Geschichte.

        Ohne `habitIds` ist der Umfang `full`, sonst `habits`. Bei einer
        Auswahl wandern nur die Tags mit, die diese Habits benutzen; das
        Tages-Journal hängt an keinem Habit und bleibt dann ganz draußen.

        Ein Datensatz kommt nur mit, wenn sein Habit ebenfalls in der Datei
        steht — sonst fände er beim Einspielen keinen Bezugspunkt.
      parameters:
        - name: habitIds
          in: query
          description: Kommaliste. Fehlt sie, wird alles gesichert.
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: false
      responses:
        "200":
          description: Sicherungsdatei
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupFile" }

  /backup/import:
    post:
      tags: [backup]
      summary: Sicherungsdatei einspielen
      description: |
        Läuft in **einer** Transaktion: entweder ist am Ende alles drin oder
        nichts. Ein halb eingespieltes Backup wäre schlimmer als ein
        fehlgeschlagenes.

        `merge` aktualisiert eine vorhandene Zeile nur, wenn die Datei ein
        neueres `updatedAt` trägt — dieselbe Last-Write-Wins-Regel wie beim
        Sync. `replace` verwirft den bisherigen Bestand vollständig und
        übernimmt die Datei unabhängig von den Zeitstempeln.

        **Einträge werden über `(habitId, date)` erkannt, nicht über `id`.**
        Zwei Geräte, die denselben Tag abgehakt haben, erzeugen verschiedene
        `id`s für denselben Sachverhalt; ein id-basierter Abgleich liefe in die
        Eindeutigkeitsbedingung. Die vorhandene `id` bleibt dabei bestehen.

        Die `userId` aus der Datei wird verworfen und durch die des
        angemeldeten Nutzers ersetzt — so lässt sich eine Sicherung in ein
        anderes Konto einspielen.

        Zeilen, deren Habit weder in der Datei noch im Bestand steht, werden
        übersprungen und im Bericht als `orphanedRows` gemeldet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, file]
              properties:
                mode: { $ref: "#/components/schemas/ImportMode" }
                file: { $ref: "#/components/schemas/BackupFile" }
      responses:
        "200":
          description: Eingespielt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "422":
          description: |
            Die Datei ist nicht einspielbar — unbekannte `formatVersion`,
            ein Habit ohne Regel oder eine doppelte Habit-`id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items: { type: string }

  # ────────────────────────────── overview ────────────────────────────
  /stats/overview:
    get:
      tags: [insights]
      summary: Alle Habits je Tag zusammengefasst
      description: |
        Grundlage der gesammelten Heatmap über den gesamten Bestand.

        **Was in `scheduled` zählt**, ist die einzige interessante Entscheidung
        hier: ein Habit zählt an einem Tag, wenn er dort *verpflichtend* war
        **oder** wenn er *erfüllt* wurde. Ein `timesPerWeek`-Habit ist an jedem
        Tag planbar, aber an keinem verpflichtend — zählte er täglich mit,
        erschiene ein 3×/Woche-Ziel an vier von sieben Tagen als verpasst und
        trübte die Übersicht dauerhaft ein. So geht ein an diesem Tag
        erledigter Wochen-Habit in Zähler und Nenner ein, ein nicht erledigter
        in keinen von beiden; `completed` kann `scheduled` nie übersteigen.

        Pausierte und übersprungene Tage fallen für den jeweiligen Habit
        heraus, eingefrorene bleiben im Nenner: ein Freeze rettet den Streak,
        schönt aber nicht die Statistik.

        Ein Tag ohne Plan hat `scheduled: 0` und ist damit ausdrücklich **nicht
        null Prozent** — er hat kein Ergebnis.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Tageswerte und Kennzahlen
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/DaySummary" }
                  perfectDays: { type: integer }
                  daysWithPlan: { type: integer }
                  totalCompletions: { type: integer }
                  perfectStreak:
                    type: integer
                    description: |
                      Serie von Tagen, an denen alles Anstehende erledigt war.
                      Tage ohne Plan unterbrechen sie nicht, und der laufende
                      Tag beendet sie nicht, solange er noch offen ist.
                  busiestDay:
                    type: integer
                    description: |
                      Höchste Zahl an Erledigungen an einem Tag — Bezugsgröße
                      der Farbskala. Die Clients bestimmen sie über die letzten
                      zwölf Monate und nicht über den gezeigten Ausschnitt,
                      damit dieselbe Farbe in Wochen- und Jahresansicht
                      dasselbe bedeutet.

  # ──────────────────────────────── sync ──────────────────────────────
  /sync:
    get:
      tags: [sync]
      summary: Änderungen seit einem Cursor holen
      description: |
        Liefert alle Zeilen des Nutzers mit `serverSeq > since`, **inklusive
        Grabsteinen**, nach `serverSeq` sortiert. Ein Client, der länger als
        90 Tage offline war, macht einen vollen Reload statt eines Deltas —
        so lange leben die Grabsteine.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDelta" }
    post:
      tags: [sync]
      summary: Lokale Änderungen hochladen
      description: |
        Der Client schickt alle als `dirty` markierten Zeilen. Der Server
        vergibt eine neue `serverSeq`, setzt `updatedAt` auf **seine eigene**
        Zeit und antwortet mit den autoritativen Werten.

        Konflikte werden per Last-Write-Wins pro Datensatz aufgelöst. Liegt
        das mitgeschickte `updatedAt` mehr als fünf Minuten in der Zukunft,
        klemmt der Server es auf seine Zeit ab — eine falsch gestellte Uhr auf
        einem Gerät soll nicht dauerhaft jeden Konflikt gewinnen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncDelta" }
      responses:
        "200":
          description: Angewandt, mit autoritativen Werten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDelta" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: In v1 ein statisches Token aus einer Umgebungsvariable,
        auf den Clients im Keychain abgelegt. Später ein JWT.

  parameters:
    HabitId:
      name: habitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Date:
      name: date
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CalendarDate" }
    From:
      name: from
      in: query
      required: true
      schema: { $ref: "#/components/schemas/CalendarDate" }
    To:
      name: to
      in: query
      required: true
      schema: { $ref: "#/components/schemas/CalendarDate" }

  responses:
    NotFound:
      description: Nicht gefunden

  schemas:
    CalendarDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      examples: ["2026-09-04"]
      description: Lokaler Kalendertag ohne Uhrzeit und ohne Zeitzone.

    HabitKind:
      type: string
      enum: [binary, quantity, avoid]

    EntrySource:
      type: string
      enum: [manual, healthKit, shortcut, api, importedFile]
      default: manual
      description: Ein späterer HealthKit-Abgleich überschreibt niemals einen
        Eintrag mit `manual` — die Korrektur von Hand gewinnt.

    TimeOfDay:
      type: string
      enum: [morning, afternoon, evening, night]

    Weekday:
      type: integer
      minimum: 1
      maximum: 7
      description: ISO-8601 — Montag ist 1, Sonntag ist 7.

    Comparison:
      type: string
      enum: [atLeast, atMost]

    DayStatusCode:
      type: string
      enum: [completed, partial, missed, frozen, paused, skipped, notScheduled, future]
      description: |
        `partial` tritt nur am laufenden Tag auf — ein vergangener Tag ist
        entweder erfüllt oder verpasst, halb erledigt zählt rückblickend nicht.

    TrendCode:
      type: string
      enum: [improving, stable, declining]

    Schedule:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: daily }
        - type: object
          required: [kind, days]
          properties:
            kind: { const: weekdays }
            days:
              type: array
              items: { $ref: "#/components/schemas/Weekday" }
        - type: object
          required: [kind, n]
          properties:
            kind: { const: timesPerWeek }
            n: { type: integer, minimum: 1, maximum: 7 }
        - type: object
          required: [kind, n, anchor]
          properties:
            kind: { const: everyNDays }
            n: { type: integer, minimum: 1 }
            anchor: { $ref: "#/components/schemas/CalendarDate" }
      description: |
        `timesPerWeek` wird **wochenweise** ausgewertet: ein leerer Dienstag ist
        kein Versäumnis, wenn Montag, Mittwoch und Freitag erledigt wurden.
        Streaks zählen dort in Wochen, nicht in Tagen.

    Target:
      type: object
      required: [value, unit, comparison]
      properties:
        value: { type: number }
        unit: { type: string, examples: ["L", "min", "Seiten"] }
        comparison: { $ref: "#/components/schemas/Comparison" }

    HabitRule:
      type: object
      required: [effectiveFrom, schedule]
      properties:
        effectiveFrom: { $ref: "#/components/schemas/CalendarDate" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        target:
          oneOf:
            - { $ref: "#/components/schemas/Target" }
            - { type: "null" }
      description: Gilt ab `effectiveFrom` bis zur nächsten Regel. Vergangene
        Tage behalten die damals gültige Version.

    HealthKitLink:
      type: object
      required: [typeIdentifier, unit, aggregation]
      properties:
        typeIdentifier: { type: string, examples: ["HKQuantityTypeIdentifierStepCount"] }
        unit: { type: string }
        aggregation: { type: string, enum: [sum, max, latest] }

    Habit:
      type: object
      required: [id, userId, name, kind, rules, colorHex, symbol, sortOrder,
                 tagIds, tracksTime, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        name: { type: string }
        notes: { type: string, nullable: true }
        kind: { $ref: "#/components/schemas/HabitKind" }
        rules:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HabitRule" }
        colorHex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        symbol: { type: string, description: SF-Symbol-Name }
        sortOrder: { type: integer }
        tagIds:
          type: array
          items: { type: string, format: uuid }
        timeOfDay:
          oneOf:
            - { $ref: "#/components/schemas/TimeOfDay" }
            - { type: "null" }
        preferredTime: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true }
        tracksTime: { type: boolean, default: false }
        startsOn:
          oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }]
        endsOn:
          oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }]
        healthKitLink:
          oneOf: [{ $ref: "#/components/schemas/HealthKitLink" }, { type: "null" }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        archivedOn:
          oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }]
          description: |
            Bewusst ein Kalendertag, kein Zeitstempel: die Auswertung muss
            wissen, ab welchem *Tag* nicht mehr geplant wird, ohne eine
            Zeitzone zu kennen. Archiviert ist nicht gelöscht.

    HabitDraft:
      type: object
      required: [name, kind, rules]
      properties:
        name: { type: string }
        notes: { type: string }
        kind: { $ref: "#/components/schemas/HabitKind" }
        rules:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HabitRule" }
        colorHex: { type: string }
        symbol: { type: string }
        tagIds: { type: array, items: { type: string, format: uuid } }
        timeOfDay: { $ref: "#/components/schemas/TimeOfDay" }
        preferredTime: { type: string }
        tracksTime: { type: boolean }
        startsOn: { $ref: "#/components/schemas/CalendarDate" }
        endsOn: { $ref: "#/components/schemas/CalendarDate" }

    HabitPatch:
      type: object
      description: Nur gesetzte Felder werden geändert. Zeitplan und Ziel nicht —
        die laufen über die Regel-Endpunkte.
      properties:
        name: { type: string }
        notes: { type: string, nullable: true }
        colorHex: { type: string }
        symbol: { type: string }
        sortOrder: { type: integer }
        timeOfDay: { oneOf: [{ $ref: "#/components/schemas/TimeOfDay" }, { type: "null" }] }
        preferredTime: { type: string, nullable: true }
        tracksTime: { type: boolean }
        startsOn: { oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        endsOn: { oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        archivedOn: { oneOf: [{ $ref: "#/components/schemas/CalendarDate" }, { type: "null" }] }
        healthKitLink: { oneOf: [{ $ref: "#/components/schemas/HealthKitLink" }, { type: "null" }] }

    Tag:
      type: object
      required: [id, userId, name, colorHex, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        name: { type: string }
        colorHex: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    Entry:
      type: object
      required: [id, habitId, date, value, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        habitId: { type: string, format: uuid }
        date: { $ref: "#/components/schemas/CalendarDate" }
        value:
          type: number
          description: "`binary`: 0 oder 1 · `quantity`: die Menge · `avoid`: Anzahl Verstöße."
        note: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/EntrySource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    EntryEvent:
      type: object
      required: [id, habitId, date, at, value, source, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        habitId: { type: string, format: uuid }
        date:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          description: Denormalisiert, damit die Tageszuordnung nicht von der
            Zeitzone des Lesers abhängt.
        at:
          type: string
          format: date-time
          description: Beginn der Sitzung.
        endsAt:
          description: |
            Ende, wenn es eine Sitzung mit Dauer ist. Ist es gesetzt, **leitet
            der Server `value` daraus ab** (Minuten) und übernimmt den
            mitgeschickten Wert nicht. Zwei Felder, die dasselbe über dieselbe
            Sitzung sagen, driften sonst auseinander — dieselbe Begründung, aus
            der `entry.value` die Summe der Ereignisse ist und nicht frei
            gesetzt wird.

            Ein Ende, das nicht nach `at` liegt, wird mit 422 abgewiesen. Eine
            Sitzung über Mitternacht behält das `date` ihres Starttages.
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        value: { type: number }
        note: { type: string, nullable: true }
        source: { $ref: "#/components/schemas/EntrySource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    DayException:
      type: object
      required: [id, date, kind, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        habitId:
          type: string
          format: uuid
          nullable: true
          description: "`null` heißt: gilt für alle Habits (Urlaub)."
        date: { $ref: "#/components/schemas/CalendarDate" }
        kind:
          type: string
          enum: [frozen, paused, skipped]
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    DayLogDraft:
      type: object
      properties:
        mood: { type: integer, minimum: 1, maximum: 5, nullable: true }
        energy: { type: integer, minimum: 1, maximum: 5, nullable: true }
        sleepHours: { type: number, nullable: true }
        note: { type: string, nullable: true }

    DayLog:
      allOf:
        - $ref: "#/components/schemas/DayLogDraft"
        - type: object
          required: [date, userId, createdAt, updatedAt]
          properties:
            date: { $ref: "#/components/schemas/CalendarDate" }
            userId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deletedAt: { type: string, format: date-time, nullable: true }

    TrashItem:
      type: object
      required: [table, id]
      properties:
        table:
          type: string
          enum: [habit, entry, entry_event, day_exception, day_log, tag]
        id: { type: string }
        deletedAt: { type: string, format: date-time }
        label: { type: string, description: Anzeigetext für die Papierkorb-Liste }

    HabitStats:
      type: object
      required: [currentStreak, longestStreak, streakUnit, completedCount,
                 evaluatedCount, days]
      properties:
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        streakUnit:
          type: string
          enum: [days, weeks]
        completionRate:
          type: number
          nullable: true
          description: "`null`, wenn nichts zu bewerten war — keine erfundene Null."
        completedCount: { type: integer }
        evaluatedCount: { type: integer }
        days:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DayStatusCode" }
          description: Schlüssel sind Kalendertage. Grundlage für Heatmap und Kalender.
        weekdayBreakdown:
          type: object
          additionalProperties: { type: number }
          description: Anteil erledigter an geplanten Tagen je ISO-Wochentag.

    SyncDelta:
      type: object
      description: |
        Dieselben Formen wie die Sicherungsdatei: ein Habit kommt **samt seinen
        Regeln und Tags**, nicht als drei getrennte Tabellen. Die Clients haben
        die passenden Typen damit schon, und die Zerlegung in Tabellen bleibt
        Sache des Servers.

        Daraus folgt eine Pflicht für die Clients: **jede Änderung an Regeln
        oder Tags muss das `updatedAt` des Habits anheben.** Die Zeilen tragen
        keine eigene `serverSeq`, sie wandern mit dem Habit — bliebe sein
        Zeitstempel stehen, wäre die Änderung beim Abgleich unsichtbar.

        Grabsteine sind enthalten: Zeilen mit gesetztem `deletedAt`. Ohne sie
        käme eine Löschung nie beim anderen Gerät an.

        `nextSeq` ist der neue Cursor, `hasMore` sagt, ob weitergelesen werden
        muss. Die Grenze `limit` schneidet an einer Sequenznummer ab, nicht an
        einer Zeilenzahl je Tabelle — sonst hielte ein Client ein Delta für
        vollständig, das mitten in einer Änderung endet.
      properties:
        habits: { type: array, items: { $ref: "#/components/schemas/Habit" } }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        events: { type: array, items: { $ref: "#/components/schemas/EntryEvent" } }
        exceptions: { type: array, items: { $ref: "#/components/schemas/DayException" } }
        dayLogs: { type: array, items: { $ref: "#/components/schemas/DayLog" } }
        focusRuns: { type: array, items: { $ref: "#/components/schemas/FocusRun" } }
        freezes:
          type: array
          items: { $ref: "#/components/schemas/FreezeEntry" }
          description: |
            Nimmt am Last-Write-Wins nicht teil — eine vorhandene Buchung bleibt
            unverändert. Eine Korrektur ist eine Gegenbuchung.
        nextSeq: { type: integer, format: int64 }
        hasMore: { type: boolean }

    DaySummary:
      type: object
      required: [date, completed, scheduled]
      properties:
        date: { $ref: "#/components/schemas/CalendarDate" }
        completed: { type: integer }
        scheduled:
          type: integer
          description: Verpflichtend an diesem Tag oder erfüllt. Siehe /stats/overview.

    IntensityScale:
      type: string
      enum: [count, share]
      description: |
        Wonach sich die Sättigung eines Tages in der Heatmap richtet.
        `count` skaliert an `busiestDay` (das GitHub-Vorbild), `share` am
        Anteil des Tagespensums.

        Die Einstufung gehört in die gemeinsame Domänenlogik, nicht in die
        jeweilige Oberfläche — sonst zeigen Mac und Browser für denselben
        Bestand verschiedene Bilder. Fünf Stufen, 0 bis 4:

          count: 0 wenn completed == 0, sonst clamp(ceil(completed / busiestDay * 4), 1, 4)
          share: 0 wenn share fehlt oder 0, sonst clamp(ceil(share * 4), 1, 4)

        Die untere Klemme auf 1 ist Absicht: bei 20 Habits wäre eine einzelne
        Erledigung rechnerisch Stufe 0,2 und der Tag sähe leer aus.

    OverviewSpan:
      type: string
      enum: [week, month, year]
      description: |
        Woche und Monat rasten am Kalender ein (Montag–Sonntag, Erster–Letzter).
        `year` sind die 53 Wochen, die auf die Ankerwoche enden — immer an einer
        Wochengrenze, damit die sieben Zeilen der Heatmap aufgehen.

    ImportMode:
      type: string
      enum: [merge, replace]

    BackupFile:
      type: object
      required: [formatVersion, exportedAt, generator, scope]
      properties:
        formatVersion:
          type: integer
          description: |
            Aktuell 1. Ein Leser weist eine höhere Version ab, statt zu raten.

            **Fehlende Listen sind kein Fehler**, sondern leer: eine Sicherung,
            die vor einer neuen Tabelle geschrieben wurde, muss lesbar bleiben,
            sonst wäre jede Erweiterung ein Bruch. Aus demselben Grund darf ein
            fremdes Werkzeug leere Listen ganz weglassen.
        exportedAt:
          type: string
          format: date-time
          description: |
            ISO 8601 mit **exakt drei Nachkommastellen** (`2026-09-05T08:00:00.000Z`),
            wie `Date.toISOString()`. Die Millisekunden sind nicht Kosmetik:
            `updatedAt` entscheidet beim Zusammenführen, welche Version gewinnt.
            Der Bruchteil ist aus ganzzahligen Millisekunden zu **runden**, nicht
            abzuschneiden — sonst wandert jeder Zeitstempel pro Export-Runde eine
            Millisekunde zurück und zwei Sicherungen desselben unveränderten
            Bestands sind nie byte-gleich.
        generator:
          type: string
          example: HabitTracker/1.0 (macOS)
        scope: { type: string, enum: [full, habits] }
        habits:
          type: array
          items: { $ref: "#/components/schemas/Habit" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EntryEvent" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/DayException" }
        dayLogs:
          type: array
          items: { $ref: "#/components/schemas/DayLog" }
        focusRuns:
          type: array
          items: { $ref: "#/components/schemas/FocusRun" }
          description: Nur beim Vollexport — ein Lauf gehört keinem einzelnen Habit.
        freezes:
          type: array
          items: { $ref: "#/components/schemas/FreezeEntry" }
          description: Nur beim Vollexport. Ohne sie wäre das Guthaben nach einer Wiederherstellung weg.

    ImportReport:
      type: object
      properties:
        mode: { $ref: "#/components/schemas/ImportMode" }
        habits: { $ref: "#/components/schemas/ImportCounts" }
        tags: { $ref: "#/components/schemas/ImportCounts" }
        entries: { $ref: "#/components/schemas/ImportCounts" }
        events: { $ref: "#/components/schemas/ImportCounts" }
        exceptions: { $ref: "#/components/schemas/ImportCounts" }
        dayLogs: { $ref: "#/components/schemas/ImportCounts" }
        focusRuns: { $ref: "#/components/schemas/ImportCounts" }
        freezes: { $ref: "#/components/schemas/ImportCounts" }
        problems:
          type: array
          items: { type: string }
          description: Nicht fatale Auffälligkeiten, die dem Nutzer anzuzeigen sind.

    ImportCounts:
      type: object
      properties:
        inserted: { type: integer }
        updated: { type: integer }
        skipped:
          type: integer
          description: Übersprungen, weil der vorhandene Datensatz neuer war.

    FocusRun:
      type: object
      required: [id, startsOn, endsOn]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        title:
          type: string
          description: Ohne Angabe zeigen die Clients „<n>-Tage-Fokus".
        startsOn: { $ref: "#/components/schemas/CalendarDate" }
        endsOn:
          $ref: "#/components/schemas/CalendarDate"
        habitIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Leer heißt alle Habits. Eine Momentaufnahme der Absicht, kein
            Fremdschlüssel — ein später gelöschter Habit darf den
            Verlaufseintrag nicht mitreißen, denn der Lauf hat stattgefunden.
        abandonedOn:
          oneOf:
            - { $ref: "#/components/schemas/CalendarDate" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    FocusOutcomeCode:
      type: string
      enum: [upcoming, running, completed, failed, abandoned]

    FocusProgress:
      type: object
      properties:
        run: { $ref: "#/components/schemas/FocusRun" }
        outcome: { $ref: "#/components/schemas/FocusOutcomeCode" }
        failedOn:
          description: Nur bei `failed` — der erste Tag mit einer Lücke.
          oneOf:
            - { $ref: "#/components/schemas/CalendarDate" }
            - { type: "null" }
        days:
          type: array
          items: { $ref: "#/components/schemas/DaySummary" }
        perfectDays: { type: integer }
        plannedDays:
          type: integer
          description: |
            Vergangene Tage des Fensters, an denen etwas anstand — der ehrliche
            Nenner. Ein Fokus über einen Mo/Mi/Fr-Habit hat in sieben Tagen nur
            drei zu vergebende; „3 von 7" neben „durchgezogen" widerspräche sich.
        elapsedDays: { type: integer }

    PeriodTotal:
      type: object
      properties:
        from: { $ref: "#/components/schemas/CalendarDate" }
        to: { $ref: "#/components/schemas/CalendarDate" }
        total:
          type: number
          description: Summe in der Einheit des Habits — bei Zeiterfassung Minuten.
        byDay:
          type: object
          additionalProperties: { type: number }
          description: Schlüssel ist der Kalendertag.
        byWeek:
          type: object
          additionalProperties: { type: number }
          description: Schlüssel ist der Montag der jeweiligen Woche.
        activeDays: { type: integer }
        sessionCount: { type: integer }
        averagePerActiveDay:
          oneOf:
            - { type: number }
            - { type: "null" }

    FreezeReason:
      type: string
      enum: [focusCompleted, applied, granted]

    FreezeEntry:
      type: object
      required: [id, amount, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        amount:
          type: integer
          description: Positiv verdient, negativ eingelöst.
        reason: { $ref: "#/components/schemas/FreezeReason" }
        habitId:
          description: Bei einer Einlösung der gerettete Habit.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        date:
          description: Bei einer Einlösung der gerettete Tag.
          oneOf:
            - { $ref: "#/components/schemas/CalendarDate" }
            - { type: "null" }
        focusRunId:
          description: |
            Bei `focusCompleted` der Lauf, der eingezahlt hat — daran erkennt
            der Server, dass derselbe Lauf nicht zweimal einzahlt.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        createdAt: { type: string, format: date-time }

    JournalMetric:
      type: string
      enum: [mood, energy, sleepHours]

    CorrelationStrength:
      type: string
      enum: [weak, moderate, strong]
      description: Schwellen auf dem Betrag von r — 0,2 / 0,4 / 0,6.

    Correlation:
      type: object
      properties:
        habitId: { type: string, format: uuid }
        metric: { $ref: "#/components/schemas/JournalMetric" }
        coefficient: { type: number }
        strength: { $ref: "#/components/schemas/CorrelationStrength" }
        dayCount:
          type: integer
          description: Tage, an denen Habit und Größe beide feststanden.
        completedDays: { type: integer }
        completedAverage: { type: number }
        missedAverage: { type: number }
