# XcodeGen erzeugt daraus das .xcodeproj. Diese Datei ist die Wahrheit und liegt
# im Repo; das generierte Projekt ist gitignored — es ist eine unlesbare,
# ständig verrauschende Datei, die niemand von Hand zusammenführen will.
#
# Erzeugen:  cd apple && xcodegen generate

name: HabitTracker

options:
  bundleIdPrefix: de.jonasreinhard.habittracker
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  HabitKit:
    path: HabitKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    # Lokal ausführen ohne Developer-Account. Für ein echtes Gerät oder
    # HealthKit später auf ein Team umstellen.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  HabitTrackerMac:
    type: application
    platform: macOS
    sources:
      - path: HabitTrackerMac
    dependencies:
      - package: HabitKit
        product: HabitUI
      - package: HabitKit
        product: HabitStore
      - package: HabitKit
        product: HabitCore
    settings:
      base:
        PRODUCT_NAME: Habit Tracker
        PRODUCT_BUNDLE_IDENTIFIER: de.jonasreinhard.habittracker.mac
        GENERATE_INFOPLIST_FILE: "YES"
        # Ohne das trägt die App das generische Platzhalter-Symbol — im Dock,
        # im Programmwechsler und in jedem System-Dialog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Ohne Sandbox, damit die Datenbank ohne Entitlement in
        # ~/Library/Application Support liegen kann.
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"

  HabitTrackerIOS:
    type: application
    platform: iOS
    sources:
      - path: HabitTrackerIOS
    dependencies:
      - package: HabitKit
        product: HabitUI
      - package: HabitKit
        product: HabitStore
      - package: HabitKit
        product: HabitCore
    # Die Team-ID steht in `Signing.xcconfig`, das nicht im Repo liegt: eine
    # persönliche Apple-ID gehört niemandem sonst. Ohne die Datei baut das
    # Target für den Simulator — der braucht keine Signatur.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # Zwei Schlüssel brauchen eine echte Plist: `NSAppTransportSecurity` ist
    # ein Verzeichnis und lässt sich nicht als `INFOPLIST_KEY_…` schreiben.
    # Die Datei wird aus dieser Beschreibung erzeugt wie das Projekt selbst.
    info:
      path: HabitTrackerIOS/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Hochkant genügt: die Ansichten sind eine Spalte, quer wäre nur
        # dieselbe Spalte mit mehr Rand.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        # **Ohne das erreicht die App den Server nicht.** App Transport
        # Security verlangt HTTPS und nimmt nur `localhost` aus — im Simulator
        # fällt das nicht auf, auf dem Gerät scheitert jeder Abgleich mit
        # „-1022“, und zwar wortlos bis auf die Fehlerzeile.
        #
        # `NSAllowsLocalNetworking` deckt `.local`-Namen und Link-Local-Adressen
        # ab, aber nicht `192.168.1.42` — und schon gar keine Tailscale-Adresse.
        # Welche Adresse der Server hat, entscheidet der Nutzer im
        # Einrichten-Feld; eine Ausnahmeliste kann sie nicht kennen.
        #
        # Deshalb die weite Ausnahme — und **nur** sie: steht
        # `NSAllowsLocalNetworking` daneben, wird `NSAllowsArbitraryLoads` seit
        # iOS 10 stillschweigend ignoriert. Zwei Schlüssel wären hier einer zu
        # viel, und der Fehler sähe genauso aus wie gar keine Ausnahme.
        #
        # Sie wiegt leicht: die App ruft genau eine Adresse auf, nämlich die
        # eingetragene. Sobald der Server unter https erreichbar ist, gehört das
        # hier wieder heraus.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Seit iOS 14 fragt das System, bevor eine App ins lokale Netz darf.
        # Ohne Begründung fragt es nicht — es verweigert.
        NSLocalNetworkUsageDescription: >-
          Für den Abgleich mit deinem eigenen Server im selben WLAN. Es gehen
          keine Daten an Dritte.
    settings:
      base:
        PRODUCT_NAME: Habit Tracker
        PRODUCT_BUNDLE_IDENTIFIER: de.jonasreinhard.habittracker.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Für den Simulator unnötig, fürs Gerät nötig — und dort füllt
        # `Signing.xcconfig` die Team-ID nach.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HabitTrackerMac:
    build:
      targets:
        HabitTrackerMac: all
    run:
      config: Debug
  HabitTrackerIOS:
    build:
      targets:
        HabitTrackerIOS: all
    run:
      config: Debug
